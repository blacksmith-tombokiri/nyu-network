<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぜんにゅー｜GOOD SIGNS, EVERY DAY</title>
<link rel="stylesheet" href="styles.css?v=20261031-3">
<link rel="stylesheet" href="mobile-fixes.css?v=20261031-3">
<link rel="stylesheet" href="desktop-v1.css?v=20261101-4">
<link rel="stylesheet" href="design-v1.css?v=20261101-2" data-zennyu-design>
<link rel="stylesheet" href="image-fixes.css?v=20261101-4">
<link rel="stylesheet" href="compact-article-v1.css?v=20261101-2">
<link rel="stylesheet" href="error-ui.css?v=20261102-1">
<style>
@media(max-width:899px){
  #featured-carousel .featured-card{display:flex!important;flex-direction:column!important;height:auto!important;min-height:0!important;background:#fff!important;border:1px solid #e0e7e1!important;overflow:hidden!important}
  #featured-carousel .featured-card::after{display:none!important;content:none!important}
  #featured-carousel .featured-media{position:relative!important;inset:auto!important;width:100%!important;height:210px!important;min-height:210px!important;flex:0 0 210px!important;overflow:hidden!important}
  #featured-carousel .featured-media.visual-good:not(:has(img)){background:linear-gradient(145deg,#f2c5bf,#cc7c72)!important}
  #featured-carousel .featured-media.visual-forward:not(:has(img)){background:linear-gradient(145deg,#b9cbe5,#6f8fc0)!important}
  #featured-carousel .featured-media.visual-nature:not(:has(img)){background:linear-gradient(145deg,#b9d8ba,#6a9a70)!important}
  #featured-carousel .featured-media.visual-repair:not(:has(img)){background:linear-gradient(145deg,#e2c4a7,#aa7548)!important}
  #featured-carousel .featured-media.visual-mind:not(:has(img)){background:linear-gradient(145deg,#d0c7e2,#8775ad)!important}
  #featured-carousel .featured-media.visual-food:not(:has(img)){background:linear-gradient(145deg,#eddcae,#c49b42)!important}
  #featured-carousel .featured-media[data-mark]::before{content:attr(data-mark)!important;position:absolute!important;inset:0!important;display:grid!important;place-items:center!important;font-size:92px!important;font-weight:900!important;color:rgba(255,255,255,.22)!important;z-index:1!important}
  #featured-carousel .featured-media img{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;z-index:2!important}
  #featured-carousel .featured-media:has(img)::before{display:none!important;content:none!important}
  #featured-carousel .featured-copy{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;padding:18px 18px 20px!important;background:#fff!important;color:#1f2924!important;z-index:2!important}
  #featured-carousel .featured-copy h2{margin:0 0 12px!important;color:#1f2924!important;font-size:21px!important;line-height:1.48!important}
  #featured-carousel .featured-comment{margin:0!important;padding-top:11px!important;border-top:1px solid #e5ebe6!important;color:#5c6861!important;font-size:12.5px!important;line-height:1.7!important}
  #featured-carousel .featured-tag{margin-bottom:10px!important}
  #featured-carousel .featured-brow{top:14px!important;left:14px!important;background:rgba(28,42,35,.72)!important;color:#fff!important;border-color:rgba(255,255,255,.18)!important;z-index:4!important}
}
@media(max-width:420px){
  #featured-carousel .featured-media{height:190px!important;min-height:190px!important;flex-basis:190px!important}
  #featured-carousel .featured-copy{padding:17px 16px 19px!important}
  #featured-carousel .featured-copy h2{font-size:20px!important}
}
@media(min-width:900px){
  #article-grid .story-thumb.visual-good:not(:has(img)){background:linear-gradient(145deg,#f2c5bf,#cc7c72)!important}
  #article-grid .story-thumb.visual-forward:not(:has(img)){background:linear-gradient(145deg,#b9cbe5,#6f8fc0)!important}
  #article-grid .story-thumb.visual-nature:not(:has(img)){background:linear-gradient(145deg,#b9d8ba,#6a9a70)!important}
  #article-grid .story-thumb.visual-repair:not(:has(img)){background:linear-gradient(145deg,#e2c4a7,#aa7548)!important}
  #article-grid .story-thumb.visual-mind:not(:has(img)){background:linear-gradient(145deg,#d0c7e2,#8775ad)!important}
  #article-grid .story-thumb.visual-food:not(:has(img)){background:linear-gradient(145deg,#eddcae,#c49b42)!important}
  #article-grid .story-thumb[data-mark]::before{content:attr(data-mark)!important;position:absolute!important;inset:0!important;display:grid!important;place-items:center!important;font-size:86px!important;font-weight:900!important;color:rgba(255,255,255,.30)!important;text-shadow:0 1px 0 rgba(0,0,0,.025)!important}
  #article-grid .story-thumb:has(img)::before{display:none!important;content:none!important}
  #article-grid .story-thumb img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}
}
</style>
</head>
<body>
<div id="site-header-root"></div>

<main id="home-app">
  <section class="desktop-brand-message wrap" aria-label="ぜんにゅーについて">
    <h1>世の中の「ちょっと良くなった」を集めるニュース。</h1>
    <p>悪いニュースだけでは見えない、小さな前進や回復、善意を届けます。</p>
  </section>

  <div class="desktop-home-shell wrap">
    <div class="desktop-main">
      <section class="featured-section">
        <div id="featured-carousel" class="featured-carousel"><div class="loading">読み込み中...</div></div>
        <div id="featured-dots" class="featured-dots" aria-label="いま読みたい善兆"></div>
      </section>

      <section class="desktop-category-cards" aria-label="気になるぜんを探す">
        <div class="desktop-category-head"><h2>気になる「ぜん」を探す</h2><p>興味のある角度から、善兆をたどる。</p></div>
        <div id="desktop-category-grid" class="desktop-cat-grid"></div>
      </section>

      <section class="category-strip wrap" aria-label="カテゴリ">
        <div id="category-tabs" class="category-tabs"></div>
      </section>

      <section class="feed-section wrap">
        <div class="sort-tabs" role="tablist" aria-label="記事の並び順">
          <button class="sort-tab active" type="button" data-sort="new" role="tab" aria-selected="true">新着記事</button>
          <button class="sort-tab" type="button" data-sort="recommended" role="tab" aria-selected="false">注目記事</button>
        </div>
        <p id="feed-status" class="feed-status"></p>
        <div id="article-grid" class="mobile-grid"></div>
        <div class="more"><button id="more-btn" type="button"><span class="more-label">もっと善兆を読む</span><span class="more-arrow" aria-hidden="true">›</span></button></div>
      </section>
    </div>

    <aside class="desktop-ranking" aria-label="よく読まれている善兆">
      <div class="desktop-rank-panel">
        <div class="desktop-rank-head"><h2>よく読まれている善兆</h2><small>直近7日間</small></div>
        <div id="desktop-ranking-list-compact" class="compact-article-list"><p class="muted">集計準備中です。</p></div>
      </div>
    </aside>
  </div>
</main>

<footer class="simple-footer"><div class="wrap"><strong>ぜんにゅー</strong><span>世の中の「ちょっと良くなった」を集めるニュース。</span></div></footer>
<script src="config.js?v=20261031-3"></script>
<script src="site-header.js?v=20261101-7"></script>
<script src="app.js?v=20261101-6"></script>
<script src="home-popular-compact.js?v=20261101-2"></script>
<script src="error-handling-v1.js?v=20261102-1"></script>
</body>
</html>
