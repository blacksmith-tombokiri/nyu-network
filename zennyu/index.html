<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ぜんにゅー | NYU Network</title>
<style>
:root{--bg:#f7f8f4;--ink:#20231f;--muted:#747b72;--line:#dfe4dc;--card:#fff;--accent:#2b6e50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(247,248,244,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:auto;padding:0 22px}.head{padding:20px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:20px}.brand{font-size:34px;font-weight:900;letter-spacing:.08em}.sub,.count{color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:15px}button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}button.active{background:#20231f;color:#fff;border-color:#20231f}.notice{margin:24px 0 14px;padding:14px 16px;border:1px solid #efcf87;background:#fff8e7;border-radius:14px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:10px 0 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;display:flex;flex-direction:column;min-height:330px;box-shadow:0 5px 20px rgba(30,40,30,.04)}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.cat{font-weight:800;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.cat-forward{background:#e7f0ff;color:#275e9c}.cat-good{background:#fff0d8;color:#9b5d00}.cat-repair{background:#efe9fb;color:#68459a}.score{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px}.score.low{color:#a35400;border-color:#e5bd77;background:#fff8e8}h2{font-size:20px;line-height:1.45;margin:0 0 12px}.summary{font-size:14px;line-height:1.75;color:#4f574f;margin:0 0 14px}.comment{font-weight:700;line-height:1.65;margin:auto 0 14px;padding-top:8px}.source{font-size:13px;color:var(--accent);text-decoration:none}.hidden{display:none!important}.error{padding:30px 0;color:#a33}footer{border-top:1px solid var(--line);padding:24px 0 42px;color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.head{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.card{min-height:0}}
</style>
</head>
<body>
<header><div class="wrap"><div class="head"><div><div class="brand">ぜんにゅー</div><div class="sub">良い兆しだけを、ちゃんと拾う。</div></div><div class="count"><strong id="shown">0</strong> / <span id="total">0</span>本表示</div></div><div class="filters" id="filters"></div></div></header>
<main class="wrap"><div class="notice">PoC確認用です。今回だけ70点台も掲載対象に含めています。</div><section class="grid" id="grid"></section><div class="error" id="error"></div></main>
<footer><div class="wrap">NYU Network / ぜんにゅー PoC · 2026</div></footer>
<script>
const SUPABASE_URL='https://nfjqakbsaahjkyoylemy.supabase.co';
const API_KEY='sb_publishable_oOmFJn59p7eCvklJGKYfrA_Zy1JNjXi';
const scoreBySlug={
'idoly-pride-offline-2026':72,'uta-macross-revival-2026':82,'taito-crown603-restoration-2026':84,'ebay-platform-transparency-2026':78,'government-ai-survey-2026':90,'mynaportal-local-procedures-2026':86,'middle-east-safety-net-guarantee-2026':86,'zentoshin-sme-support-2026':89,'diet-answer-ai-prototype-2026':83,'ip5-ai-cooperation-2026':75,'patent-standard-strategy-review-2026':81,'data-start-award-2026':78,'lithium-battery-safety-portal':86,'smart-register-support-2026':82,'pmh-expands-2026':92,'resas-update-2026':86,'summer-energy-bill-support-2026':86,'university-startups-record-2026':91,'noto-business-recovery-ishikawa-2026':93,'noto-business-recovery-fukui-2026':88};
const labels={forward:'前',good:'善',repair:'繕',nature:'然',mind:'禅',food:'膳'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let articles=[];
function sourceOf(a){return Array.isArray(a.sources)&&a.sources.length?a.sources.find(x=>x.primary)||a.sources[0]:null}
function renderCards(list){const grid=document.getElementById('grid');grid.innerHTML=list.map(a=>{const score=scoreBySlug[a.slug]??0,s=sourceOf(a),code=a.primary_category_code;return `<article class="card" data-cat="${esc(code)}" data-score="${score}"><div class="meta"><span class="cat cat-${esc(code)}">${esc(a.primary_category_label)}</span><span class="score ${score<80?'low':''}">善兆スコア ${score}</span></div><h2>${esc(a.title)}</h2><p class="summary">${esc(a.summary)}</p><p class="comment">「${esc(a.zencho_comment)}」</p>${s?`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`:''}</article>`}).join('');document.getElementById('shown').textContent=list.length}
function renderFilters(){const counts={all:articles.length,forward:0,good:0,repair:0,nature:0,mind:0,food:0,'70s':0};articles.forEach(a=>{counts[a.primary_category_code]=(counts[a.primary_category_code]||0)+1;if((scoreBySlug[a.slug]??0)<80)counts['70s']++});const order=['all','forward','good','repair','nature','mind','food','70s'];document.getElementById('filters').innerHTML=order.map((k,i)=>`<button class="${i===0?'active':''}" data-filter="${k}">${k==='all'?'すべて':k==='70s'?'70点台':labels[k]} ${counts[k]}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;renderCards(articles.filter(a=>f==='all'||a.primary_category_code===f||(f==='70s'&&(scoreBySlug[a.slug]??0)<80)))})}
async function load(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/nyu_public_articles?brand_slug=eq.zen&select=*`,{headers:{apikey:API_KEY,Authorization:`Bearer ${API_KEY}`}});if(!r.ok)throw new Error(`HTTP ${r.status}`);articles=await r.json();articles.sort((a,b)=>new Date(b.published_at)-new Date(a.published_at));document.getElementById('total').textContent=articles.length;renderFilters();renderCards(articles)}catch(e){document.getElementById('error').textContent='記事の読み込みに失敗しました: '+e.message}}
load();
</script>
</body></html>
