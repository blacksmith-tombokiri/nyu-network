<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぜんにゅー｜GOOD SIGNS, EVERY DAY</title>
<link rel="stylesheet" href="styles.css?v=20261031-3">
<link rel="stylesheet" href="mobile-fixes.css?v=20261031-3">
<link rel="stylesheet" href="desktop-v1.css?v=20261101-4">
<link rel="stylesheet" href="design-v1.css?v=20261101-1" data-zennyu-design>
<link rel="stylesheet" href="image-fixes.css?v=20261101-1">
</head>
<body>
<div id="site-header-root"></div>

<main id="home-app">
  <section class="desktop-brand-message wrap" aria-label="ぜんにゅーについて">
    <small>GOOD SIGNS, EVERY DAY</small>
    <h1>世の中の「ちょっと良くなった」を集めるニュース。</h1>
    <p>悪いニュースだけでは見えない、小さな前進や回復、善意を届けます。</p>
  </section>

  <div class="desktop-home-shell wrap">
    <div class="desktop-main">
      <section class="featured-section">
        <div id="featured-carousel" class="featured-carousel"><div class="loading">読み込み中...</div></div>
        <div id="featured-dots" class="featured-dots" aria-label="いま読みたい善兆"></div>
      </section>

      <section class="desktop-category-cards" aria-label="気になるぜんを探す">
        <div class="desktop-category-head"><h2>気になる「ぜん」を探す</h2><p>興味のある角度から、善兆をたどる。</p></div>
        <div id="desktop-category-grid" class="desktop-cat-grid"></div>
      </section>

      <section class="category-strip wrap" aria-label="カテゴリ">
        <div id="category-tabs" class="category-tabs"></div>
      </section>

      <section class="feed-section wrap">
        <div class="sort-tabs" role="tablist" aria-label="記事の並び順">
          <button class="sort-tab active" type="button" data-sort="new" role="tab" aria-selected="true">新着記事</button>
          <button class="sort-tab" type="button" data-sort="recommended" role="tab" aria-selected="false">注目記事</button>
        </div>
        <p id="feed-status" class="feed-status"></p>
        <div id="article-grid" class="mobile-grid"></div>
        <div class="more"><button id="more-btn" type="button"><span class="more-label">もっと善兆を読む</span><span class="more-arrow" aria-hidden="true">›</span></button></div>
      </section>
    </div>

    <aside class="desktop-ranking" aria-label="よく読まれている善兆">
      <div class="desktop-rank-panel">
        <div class="desktop-rank-head"><h2>よく読まれている善兆</h2><small>直近7日間</small></div>
        <div id="desktop-ranking-list" class="desktop-rank-list"><p class="muted">集計準備中です。</p></div>
      </div>
    </aside>
  </div>
</main>

<footer class="simple-footer"><div class="wrap"><strong>ぜんにゅー</strong><span>世の中の「ちょっと良くなった」を集めるニュース。</span></div></footer>
<script src="config.js?v=20261031-3"></script>
<script src="site-header.js?v=20261101-7"></script>
<script src="app.js?v=20261101-5"></script>
</body>
</html>
