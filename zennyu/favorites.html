.favorite-summary{display:flex;align-items:baseline;gap:8px;margin:0 0 22px;color:#5f6b64}.favorite-summary strong{font-size:28px;color:#25312b}.favorite-grid{display:grid;gap:16px}.favorite-card{border:1px solid #dfe6e0;border-radius:18px;background:#fff;overflow:hidden}.favorite-card-main{display:grid;grid-template-columns:180px 1fr;color:inherit;text-decoration:none}.favorite-thumb{position:relative;min-height:140px;background:#e8ede9;overflow:hidden}.favorite-thumb img{width:100%;height:100%;object-fit:cover;display:block}.favorite-thumb span{position:absolute;top:10px;left:10px;background:rgba(34,48,40,.78);color:#fff;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.favorite-thumb[data-mark]::before{content:attr(data-mark);position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:900;color:rgba(255,255,255,.28)}.favorite-copy{padding:18px}.favorite-copy small{font-weight:700;color:#66756c}.favorite-copy h2{font-size:20px;line-height:1.5;margin:6px 0 10px}.favorite-copy p{margin:0;color:#667169;line-height:1.7}.favorite-remove{margin:0 18px 16px;border:0;background:transparent;color:#68756e;text-decoration:underline;cursor:pointer}.favorite-empty{border:1px solid #dfe6e0;border-radius:18px;background:#fff;padding:28px}.favorite-empty strong{display:block;font-size:20px;margin-bottom:8px}.favorite-empty p{color:#667169;line-height:1.7}.favorite-empty a{color:#2b6e50;font-weight:700;text-decoration:none}@media(max-width:680px){.favorite-card-main{grid-template-columns:1fr}.favorite-thumb{min-height:190px}}
</style>
