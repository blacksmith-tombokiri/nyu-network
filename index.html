<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYU Network</title>
<style>
:root{--bg:#f5f7f4;--ink:#20231f;--muted:#737a72;--line:#dce2da;--card:#fff;--green:#2b6e50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif}.wrap{max-width:1000px;margin:0 auto;padding:0 22px}header{padding:70px 0 30px}h1{font-size:clamp(42px,8vw,76px);margin:0;letter-spacing:-.04em}.lead{font-size:18px;color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:28px 0 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;min-height:220px;display:flex;flex-direction:column}.card h2{font-size:28px;margin:0 0 8px}.card p{color:var(--muted);line-height:1.7}.card a{margin-top:auto;color:var(--green);font-weight:700;text-decoration:none}.soon{opacity:.45}footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>NYU NETWORK</div>
  <h1>ニュースを、別の角度から。</h1>
  <p class="lead">NYU Networkは、「○○にゅー」ブランド群のための共通プラットフォームです。現在は、良い兆しを集める「ぜんにゅー」のPoCを公開しています。</p>
</header>
<section class="grid">
  <article class="card"><h2>ぜんにゅー</h2><p>社会の中にある「良い兆し」を拾い、短く分かりやすく届けるニュースメディア。</p><a href="./zennyu/">PoCを見る →</a></article>
  <article class="card soon"><h2>せんにゅー</h2><p>将来追加予定。</p></article>
  <article class="card soon"><h2>しょうにゅー</h2><p>将来追加予定。</p></article>
</section>
<footer>© 2026 NYU Network. All Rights Reserved.</footer>
</div>
</body>
</html>
