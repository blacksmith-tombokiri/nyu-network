<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ぜんにゅー｜APIなし記事試作25件</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#f6f7f5;color:#243329}
*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe6df;padding:24px max(18px,calc((100vw - 1060px)/2))}
main{max-width:1060px;margin:24px auto;padding:0 16px 50px}h1{font-size:24px;margin:8px 0}h2{font-size:18px}
a{color:#176b4d}p{line-height:1.8}.small{font-size:13px;color:#5f7066}.flag{display:inline-block;padding:4px 10px;border-radius:6px;background:#fff1d6;color:#78521b;font-size:12px;font-weight:700}
.card{background:#fff;border:1px solid #dce4db;border-radius:12px;padding:20px;margin:15px 0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px}.metric{background:#fff;border:1px solid #dce4db;border-radius:10px;padding:16px}.metric strong{font-size:24px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:730px){.grid{grid-template-columns:1fr}}
.tag{border-radius:5px;background:#e8ede9;color:#34483c;padding:4px 8px;font-size:12px;display:inline-block;margin:0 7px 7px 0}
.ver{background:#e1f2e6;color:#23613e}.warn{background:#fff1d6;color:#795218}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f4;padding:14px;border-radius:6px;line-height:1.8;font-family:inherit;font-size:14px}
button,select{border:1px solid #aebfb2;padding:8px 10px;border-radius:7px;background:white;font:inherit;cursor:pointer}details{margin-top:14px}summary{cursor:pointer}
.notice{padding:14px;background:#fcf4e4;border-left:4px solid #c78b30;border-radius:5px}.muted{color:#647169}
</style></head>
<body><header><a href="index.html?brand=zen">← 編集デスクへ</a><h1>GPT編集 vs APIなし｜25件比較</h1>
<p class="small">公式記事そのものではありません。AIなし定型文・GPT編集稿・既存記事を比較する非公開実験です。</p></header>
<main><div class="notice"><strong>試験専用・公開不可</strong><p>今回のGPT編集原稿も試作であり、正式な善兆スコア・掲載判断ではありません。25件中24件は元記事の厳格な再照合が未実施です。文章が自然でも事実が正しいとは限りません。公開・再登録は禁止しています。</p></div>
<div id="status" class="card" role="status">管理者セッションを確認しています…</div>
<div id="app" hidden><div class="summary" id="metrics"></div><div class="card"><label>対象 <select id="kind"><option value="all">25件すべて</option><option value="new">未掲載の記事案</option><option value="benchmark">既存記事との比較</option></select></label>
<label style="margin-left:12px">根拠 <select id="source"><option value="all">すべて</option><option value="official_confirmed">公式根拠照合済み</option><option value="requires_recheck">再確認が必要</option></select></label></div>
<div id="list"></div></div></main>
<script src="../zennyu/config.js?v=20261031-3"></script>
<script>
(() => {
 const cfg=window.ZENNEWS_CONFIG, sessionKey='nyu_admin_session_v1', status=document.querySelector('#status'), app=document.querySelector('#app');
 const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 let all=[];
 function readSession(){try{return JSON.parse(localStorage.getItem(sessionKey)||localStorage.getItem('zennyu_admin_session_v1')||'null')}catch{return null}}
 async function run(){
   if(!cfg?.supabaseUrl||!cfg?.publishableKey){status.textContent='接続設定がありません。';return}
   let s=readSession();if(!s?.access_token){status.innerHTML='管理者ログインが必要です。<a href="index.html?brand=zen">編集デスクでログイン</a>してください。';return}
   const root=cfg.supabaseUrl+'/rest/v1/';
   async function get(path,token){return fetch(root+path,{headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+token}})}
   let res=await get('nyu_template_draft_trials?select=*&trial_batch=eq.noapi_20261111_v01&order=source_published_at.desc',s.access_token);
   if(res.status===401&&s.refresh_token){
     const rr=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
     if(rr.ok){const j=await rr.json();s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+Math.max(0,(j.expires_in-30)*1000),user:j.user};localStorage.setItem(sessionKey,JSON.stringify(s));res=await get('nyu_template_draft_trials?select=*&trial_batch=eq.noapi_20261111_v01&order=source_published_at.desc',s.access_token)}
   }
   if(!res.ok){status.textContent='取得できませんでした。認証状態・管理者権限をご確認ください（HTTP '+res.status+'）。';return}
   all=await res.json();
   status.textContent=all.length+'件を取得しました。試験データは本番記事・本番評価とは完全に分離されています。';
   app.hidden=false;
   const newOnly=all.filter(x=>!x.is_existing_article_benchmark).length, verified=all.filter(x=>x.source_verification==='official_confirmed').length;
   const changed=all.filter(x=>x.draft_title!==x.source_title).length,short=all.filter(x=>x.draft_body.length<80).length;
   document.querySelector('#metrics').innerHTML=[
    ['比較サンプル',all.length+'件'],['GPT記事を作成',all.filter(x=>x.gpt_draft_body).length+'件'],['掲載検討',all.filter(x=>x.gpt_editorial_decision==='consider').length+'件'],['保留・見送り',all.filter(x=>x.gpt_editorial_decision!=='consider').length+'件'],['照合済み原文',verified+'件'],['既存記事との比較',all.length-newOnly+'件']
   ].map(x=>'<div class="metric"><span class="small">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');
   function render(){
    const kind=document.querySelector('#kind').value,source=document.querySelector('#source').value;
    const rows=all.filter(x=>(kind==='all'||(kind==='new'&&!x.is_existing_article_benchmark)||(kind==='benchmark'&&x.is_existing_article_benchmark))&&(source==='all'||x.source_verification===source));
    document.querySelector('#list').innerHTML=rows.map(x=>{
      const date=x.source_published_at?new Date(x.source_published_at).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'}):'日付不明';
      const verified=x.source_verification==='official_confirmed';
      return '<article class="card"><div><span class="tag '+(verified?'ver':'warn')+'">'+(verified?'公式本文照合済み':'根拠の再確認が必要')+'</span><span class="tag">'+(x.is_existing_article_benchmark?'既存記事との比較':'未掲載試験案')+'</span><span class="tag">公開不可</span></div>'
      +'<h2>'+esc(x.gpt_draft_title||x.draft_title)+'</h2><p class="small">'+esc(x.source_name)+' ｜ '+esc(date)+' ｜ 実施段階 '+esc(x.implementation_stage)+' ｜ 仮編集判断 '+esc(({consider:'掲載検討',hold:'保留',skip:'見送り'})[x.gpt_editorial_decision]||'未評価')+'</p>'
      +'<div class="grid"><section><strong>GPT編集版（未検証・非公開）</strong><p><strong>'+esc(x.gpt_draft_title||'未作成')+'</strong></p><pre>'+esc(x.gpt_draft_body||'未作成')+'</pre><p class="small"><strong>GPTの仮編集理由：</strong>'+esc(x.gpt_editorial_reason||'なし')+'</p></section>'
      +'<section><strong>AIなし定型文版</strong><p><strong>'+esc(x.draft_title)+'</strong></p><pre>'+esc(x.draft_body)+'</pre><p class="small">診断値：'+esc(x.quality_score)+'/100（善兆点数ではありません）</p></section></div>'
      +'<section><strong>元のニュース</strong><p><a href="'+esc(x.source_url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.source_title)+'</a></p>'
      +(x.is_existing_article_benchmark?'<p><strong>既存記事タイトル</strong><br>'+esc(x.existing_article_title||'なし')+'</p><p><strong>既存記事の要約</strong><br>'+esc(x.existing_article_summary||'なし')+'</p>':'<p class="small">まだサイト記事として存在しないものを試作しています。</p>')
      +'</section></div><details><summary>注意事項・機械的チェック</summary><p class="small">'+(x.warnings||[]).map(esc).join(' ／ ')+'</p><pre>'+esc(JSON.stringify(x.quality_checks,null,2))+'</pre></details></article>';
    }).join('')||'<div class="card">該当する試験記事はありません。</div>';
   }
   document.querySelector('#kind').addEventListener('change',render);
   document.querySelector('#source').addEventListener('change',render);
   render();
 }
 run().catch(e=>{status.textContent='読み込みエラー：'+String(e.message||e)})
})();
</script></body></html>
