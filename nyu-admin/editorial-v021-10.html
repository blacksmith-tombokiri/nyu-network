<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ぜんにゅー｜Ver.0.2.1 10ジャンル実験</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#263a2f;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}
header{background:#fff;border-bottom:1px solid #d9e3da;padding:22px max(18px,calc((100vw - 1050px)/2))}
h1{font-size:25px;margin:12px 0 6px}h2{font-size:20px;line-height:1.5}p{line-height:1.85}
a{color:#176747}main{max-width:1050px;padding:0 16px 55px;margin:24px auto}
article{background:white;border:1px solid #dce5db;border-radius:12px;margin:16px 0;padding:22px}
.note{background:#fff6e7;border-left:4px solid #ba8535;padding:16px;border-radius:6px}
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:#eaf2ed;padding:5px 9px;border-radius:5px;color:#315a43}.tag.warn{background:#fff3da;color:#7d5c18}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}
.stat{background:white;border:1px solid #dae4da;border-radius:10px;padding:16px}.stat strong{font-size:25px;display:block}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}@media(max-width:720px){.row{grid-template-columns:1fr}}
.body{white-space:pre-wrap;background:#f8faf7;border-radius:9px;padding:18px;line-height:2;font-size:15px}
.small{font-size:13px;color:#617568}details{font-size:13px}summary{cursor:pointer;font-weight:bold}
</style></head>
<body><header><a href="index.html?brand=zen">← 編集デスク</a><h1>Ver.0.2.1 異ジャンル10記事テスト</h1><p class="small">柔らかな文体を維持し、事実の段階・補足根拠・結び・1記事1善兆を検査します。</p></header>
<main><div class="note"><strong>公開不可の編集試験です。</strong><p>文章の4基準のチェックは一次自己評価です。事実の厳格な原文再検証、正式善兆スコア、記事公開許可は別工程です。旧ファクトパックを使ったサンプルがあり、内容を事実確認済みの記事と混同しないでください。元の記事へのリンクは閲覧者が確認できるよう残しています。</p></div>
<div id="status" class="note">管理者認証と試験稿を読み込んでいます…</div><div class="summary" id="summary" hidden></div><div id="articles"></div>
</main><script src="../zennyu/config.js?v=20261031-3"></script><script>
(async()=>{
const cfg=window.ZENNEWS_CONFIG,status=document.querySelector('#status'),articles=document.querySelector('#articles'),summary=document.querySelector('#summary');
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let s;try{s=JSON.parse(localStorage.getItem('nyu_admin_session_v1')||localStorage.getItem('zennyu_admin_session_v1')||'null')}catch{}
if(!cfg?.supabaseUrl||!cfg?.publishableKey){status.textContent='設定が見つかりません。';return}
if(!s?.access_token){status.innerHTML='管理者ログインが必要です。<a href="index.html?brand=zen">編集デスクでログインする</a>';return}
async function get(token){return fetch(cfg.supabaseUrl+'/rest/v1/nyu_editorial_v021_trials?select=*&batch=eq.style_v021_20261111&order=trial_order.asc',{headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+token,Accept:'application/json'}})}
try{
let r=await get(s.access_token);
if(r.status===401&&s.refresh_token){
const rr=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
if(rr.ok){const j=await rr.json();s={...j,expires_at:Date.now()+Math.max(0,Number(j.expires_in||3600)-30)*1000};localStorage.setItem('nyu_admin_session_v1',JSON.stringify(s));r=await get(s.access_token)}
}
if(!r.ok)throw new Error('HTTP '+r.status+'。管理者権限・セッションをご確認ください');
const rows=await r.json();if(rows.length!==10)throw new Error('試験稿が10件そろっていません');
status.textContent='10件のVer.0.2.1原稿を取得しました。すべて試験専用・非公開です。';
const reviewed=rows.filter(x=>x.evidence_status==='manual_source_reviewed_recheck_needed').length;
summary.hidden=false;summary.innerHTML=[['検証記事',rows.length+'本'],['対象ジャンル',new Set(rows.map(x=>x.category_label)).size+'分野'],['過去の本文確認記録',reviewed+'本'],['厳格な公開審査済み','0本']].map(x=>'<div class="stat"><span class="small">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');
articles.innerHTML=rows.map(x=>{
const evidence=x.evidence_status==='manual_source_reviewed_recheck_needed'?'過去の本文確認記録あり・再検証待ち':x.evidence_status==='official_body_verified'?'公式HTML照合記録あり・公開審査未実施':'旧ファクトパック・再検証待ち';
return '<article><div class="head"><div class="tags"><span class="tag">No.'+x.trial_order+'</span><span class="tag">'+esc(x.category_label)+'</span><span class="tag warn">公開不可</span></div><span class="small">'+esc(evidence)+'</span></div>'
+'<h2>'+esc(x.draft_title)+'</h2><div class="row"><section><h3>Ver.0.2.1 記事案</h3><p class="body">'+esc(x.draft_body)+'</p></section>'
+'<aside><h3>編集チェック</h3><p>'+[['事実の段階',x.check_stage],['説明の根拠',x.check_context],['自然な結び',x.check_ending],['1記事1善兆',x.check_one_sign]].map(a=>(a[1]?'✓':'要修正')+' '+a[0]).join('<br>')+'</p>'
+'<details><summary>編集上の確認事項</summary><p>'+esc(x.assessment_note)+'</p></details>'
+'<p class="small"><strong>元ニュース：</strong>'+esc(x.source_name)+'</p><p><a href="'+esc(x.source_url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.source_title)+'</a></p>'
+'</aside></div></article>'
}).join('');
}catch(e){status.textContent='取得できませんでした：'+String(e.message||e)}
})();
</script></body></html>
