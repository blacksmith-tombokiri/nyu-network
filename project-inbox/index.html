<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Project Inbox</title>
<link rel="stylesheet" href="inbox.css?v=20261103-1">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">PROJECT INBOX</p>
    <h1>Project Inbox</h1>
    <p class="sub">各プロジェクトのお問い合わせを一か所で管理します。</p>
  </div>
  <div class="top-actions">
    <span id="user-label"></span>
    <button id="logout-btn" class="ghost" type="button" hidden>ログアウト</button>
  </div>
</header>

<main class="shell">
  <section id="login-panel" class="panel login-panel">
    <h2>管理者ログイン</h2>
    <form id="login-form">
      <label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
      <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">ログイン</button>
    </form>
    <p id="login-message" class="message"></p>
  </section>

  <section id="inbox-app" hidden>
    <section class="panel toolbar">
      <div class="stats">
        <div><strong id="count-all">0</strong><span>すべて</span></div>
        <div><strong id="count-new">0</strong><span>未対応</span></div>
        <div><strong id="count-progress">0</strong><span>対応中</span></div>
        <div><strong id="count-replied">0</strong><span>返信済み</span></div>
        <div><strong id="count-done">0</strong><span>完了</span></div>
      </div>
      <div class="filters">
        <select id="project-filter" aria-label="プロジェクトで絞り込み"><option value="all">すべてのプロジェクト</option></select>
        <select id="status-filter" aria-label="状態で絞り込み">
          <option value="all">すべての状態</option>
          <option value="new">未対応</option>
          <option value="in_progress">対応中</option>
          <option value="replied">返信済み</option>
          <option value="done">完了</option>
        </select>
      </div>
    </section>
    <div id="status" class="status"></div>
    <div id="inquiry-list"></div>
  </section>
</main>
<script src="../zennyu/config.js?v=20261031-3"></script>
<script src="inbox.js?v=20261103-1"></script>
</body>
</html>
